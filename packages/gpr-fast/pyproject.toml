[build-system]
requires = ["setuptools>=69,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpr-fast"
version = "1.0.0"
description = "Optimized GPR fuzzy-rule classifier"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "setuptools>=69,<82",
    "deap==1.3.1",
    "geppy==0.1.3",
    "numpy==1.21.6",
    "numba==0.57.1",
]

[tool.setuptools.packages.find]
where = ["src"]
